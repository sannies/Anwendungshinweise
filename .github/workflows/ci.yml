name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Lint, Tests & cdk synth (uv + poe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync environment
        run: uv sync
      - name: Lint
        run: uv run poe lint
      - name: Tests
        run: uv run poe test
      - name: cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: eu-central-1
        run: uv run poe synth

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
