name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
      - name: Ruff
        run: ruff check backend
      - name: Pytest
        run: cd backend && pytest -q

  infra:
    name: Infrastruktur (pytest + cdk synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements-dev.txt
      - name: Ruff
        run: ruff check infra
      - name: Pytest (Template-Assertions)
        run: cd infra && PYTHONPATH=. pytest -q
      - name: cdk synth
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: eu-central-1
        run: npx --yes aws-cdk@2 synth --quiet

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
